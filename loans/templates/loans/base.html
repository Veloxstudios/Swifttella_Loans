{% load static %}<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Swiftella Loans{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'loans/site.css' %}">
</head>
<body>
  <header class="top"><div class="wrap"><a class="logo" href="{% url 'loans:apply' %}">Swiftella<span>Loans</span></a></div></header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap foot">
    Late repayment can cause you serious money problems. For help, go to <a href="https://www.moneyhelper.org.uk" rel="noopener">moneyhelper.org.uk</a>.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
